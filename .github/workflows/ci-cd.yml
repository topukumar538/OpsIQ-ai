name: CI/CD

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env
        run: |
          cat <<EOF > .env
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY || 'gsk_ci_placeholder_not_a_real_key' }}
          SECRET_KEY=${{ secrets.SECRET_KEY || 'ci0000000000000000000000000000000000placeholder' }}
          POSTGRES_USER=opsiq
          POSTGRES_PASSWORD=opsiq_ci_password
          POSTGRES_DB=opsiq
          EOF

      - name: Build Docker image
        run: docker compose --profile test build

      - name: Start PostgreSQL
        run: |
          docker compose up -d db
          timeout 60s bash -c '
            until [ "$(docker inspect -f "{{.State.Health.Status}}" opsiq_db)" = "healthy" ]; do
              sleep 2
            done
          '

      - name: Create test database
        run: |
          EXISTS=$(docker compose exec -T db \
            psql -U opsiq -d opsiq -tAc \
            "SELECT 1 FROM pg_database WHERE datname='opsiq_test'")
          if [ "$EXISTS" != "1" ]; then
            docker compose exec -T db \
              psql -U opsiq -d opsiq \
              -c "CREATE DATABASE opsiq_test"
          fi

      - name: Run tests
        run: docker compose --profile test run --rm tests

      - name: Cleanup
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to Hugging Face
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git remote add space \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"
          git push space HEAD:main --force